<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Store Kiosk</title>

  <!-- Fonts: Plus Jakarta Sans (interface) and JetBrains Mono (receipt, transaction numbers).
       If the kiosk is offline, the browser falls back to system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- The whole kiosk is rendered into this container by js/app.js -->
  <div id="app"></div>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
