<!DOCTYPE html>
<html lang="en">
<!--
  PENDING OPTIMIZATIONS (not yet merged)
  Implemented in the optimization branch as index-optimizedv1.html.
  This file on main does not include them yet.

  - Load scripts with defer (execution order unchanged: products.js, then app).
  - Point asset references to the optimized files:
    css/styles-optimizedv1.css and js/app-optimizedv1.js.
  - Not included in this round: self-hosting the Google Fonts files to remove
    the external, render-blocking request (follow-up).
-->
  <head>
  <meta charset="UTF-8">
  <!-- Tablet kiosk: fit the screen width, and stop pinch-zoom so a stray touch never zooms the kiosk. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1c120c">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Slurp Noodle House Kiosk</title>

  <!-- Fonts: Poppins (interface) and JetBrains Mono (receipt, transaction numbers).
       If the kiosk is offline, the browser falls back to system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- The whole kiosk is rendered into this container by js/app.js -->
  <div id="app"></div>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
