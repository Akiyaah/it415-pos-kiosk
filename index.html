<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Tablet kiosk: fit the screen width, and stop pinch-zoom so a stray touch never zooms the kiosk. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1c120c">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Slurp Noodle House Kiosk</title>

  <!-- Fonts: Poppins (interface) and JetBrains Mono (receipt, transaction numbers).
       If the kiosk is offline, the browser falls back to system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- The whole kiosk is rendered into this container by js/app.js -->
  <div id="app"></div>

  <!-- Plain scripts, no build step. ORDER MATTERS: each file may use the ones above it. -->
  <script src="js/products.js"></script>  <!-- menu data -->
  <script src="js/state.js"></script>     <!-- state, constants, transaction numbers -->
  <script src="js/helpers.js"></script>   <!-- peso(), cart math, toast -->
  <script src="js/icons.js"></script>     <!-- line icons -->
  <script src="js/art.js"></script>       <!-- dish illustrations -->
  <script src="js/cart.js"></script>      <!-- add / change quantity / remove -->
  <script src="js/cash.js"></script>      <!-- cash keypad + quick amounts -->
  <script src="js/payment.js"></script>   <!-- validation, payments, navigation -->
  <script src="js/views.js"></script>     <!-- one function per screen -->
  <script src="js/app.js"></script>       <!-- render + click handling (starts the app) -->
</body>
</html>
